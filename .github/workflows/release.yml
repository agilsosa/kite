name: Release

# Windows installers are built on a Windows runner because Squirrel.Windows is
# not reliable on other platforms. Linux packages are built on Ubuntu, where
# `dpkg-deb` and `rpmbuild` are available. The Linux job runs after the Windows
# job so the GitHub Release already exists when it uploads its assets.
#
# Pushing a version tag (for example `v1.0.1`) publishes a public GitHub
# Release, which update.electronjs.org then serves to installed Windows copies
# of Kite. Linux packages are downloaded and installed manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content apps/kite/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match apps/kite/package.json version v$version. Bump the version before tagging."
          }

      - name: Build and publish the GitHub Release
        run: npm run release --workspace=kite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./apps/kite/package.json').version")"
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match apps/kite/package.json version v$version. Bump the version before tagging."
            exit 1
          fi

      - name: Build the Debian and RPM packages
        run: npm run make:linux --workspace=kite

      - name: Upload the Linux packages to the release
        working-directory: apps/kite
        run: npx electron-forge release --from-make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Kite's Linux update helper downloads one of these packages and verifies
      # it against this file before installing it as root.
      - name: Publish the Linux checksums
        working-directory: apps/kite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            (cd out/make/deb/x64 && sha256sum *.deb)
            (cd out/make/rpm/x64 && sha256sum *.rpm)
          } > SHA256SUMS
          cat SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          gh release upload "v${version}" SHA256SUMS --clobber
